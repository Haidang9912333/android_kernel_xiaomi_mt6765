name: Build_Redmi9C_Final_Success
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: xiaomi-mt6765/android_kernel_xiaomi_mt6765
          ref: lineage-17.1

      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential git libssl-dev python3 flex bison
          # Clone Toolchain
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 gcc64
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 --depth=1 gcc32

      - name: Patch Docker Config
        run: |
          # Tìm file config phù hợp nhất
          CONF=$(find arch/arm64/configs/ -name "mt6765_defconfig" -o -name "defconfig" | head -n 1)
          echo "Using Config: $CONF"
          
          cat <<EOF >> $CONF
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CPUSETS=y
          CONFIG_BRIDGE=y
          CONFIG_VETH=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y
          EOF

      - name: Build Kernel
        run: |
          # TỰ ĐỘNG TÌM ĐƯỜNG DẪN BIN (Sửa lỗi No such file)
          GCC64_BIN=$(find $(pwd)/gcc64 -name "aarch64-linux-android-gcc" -exec dirname {} \;)
          GCC32_BIN=$(find $(pwd)/gcc32 -name "arm-linux-androideabi-gcc" -exec dirname {} \;)
          
          export PATH=$GCC64_BIN:$GCC32_BIN:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          # Lấy tên file config ngắn gọn
          CONF_NAME=$(basename $(find arch/arm64/configs/ -name "mt6765_defconfig" -o -name "defconfig" | head -n 1))
          
          make O=out $CONF_NAME
          
          # Build Image.gz-dtb và bỏ qua dtbo_check (Sửa lỗi No rule to make target)
          make -j$(nproc --all) O=out Image.gz-dtb

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Redmi9C_Docker_Success
          path: out/arch/arm64/boot/Image.gz-dtb
