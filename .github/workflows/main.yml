name: Build_Redmi9C_Docker_Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: xiaomi-mt6765/android_kernel_xiaomi_mt6765
          ref: lineage-17.1

      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential gcc-aarch64-linux-gnu clang git libssl-dev python3

      - name: Setup Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang --depth=1 clang-proton

      - name: Write Docker Config to defconfig
        run: |
          # Đường dẫn đến file defconfig trong repo của bạn
          CONF=arch/arm64/configs/defconfig
          
          # Ghi đè các thông số quan trọng nhất cho Docker
          cat <<EOF >> $CONF
          # Docker Support
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CPUSETS=y
          CONFIG_BRIDGE=y
          CONFIG_VETH=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_USER_NS=y
          EOF
          echo "Config updated successfully!"

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang-proton/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Sử dụng file defconfig đã được ghi thêm code Docker
          make O=out defconfig
          make -j$(nproc --all) O=out \
                      CC=clang \
                      AR=llvm-ar \
                      NM=llvm-nm \
                      OBJCOPY=llvm-objcopy \
                      OBJDUMP=llvm-objdump \
                      STRIP=llvm-strip

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Docker_Angelica
          path: out/arch/arm64/boot/Image.gz-dtb
