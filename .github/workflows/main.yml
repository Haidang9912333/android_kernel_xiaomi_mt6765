name: Build_Docker_Redmi9C_U22
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: xiaomi-mt6765/android_kernel_xiaomi_mt6765
          ref: lineage-17.1

      - name: Setup Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential git libssl-dev python3 python3-pip
          # Tải GCC 4.9 chuẩn từ Google để đảm bảo không lỗi link trên U22
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 gcc64
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 --depth=1 gcc32

      - name: Inject Docker Config
        run: |
          CONF=arch/arm64/configs/defconfig
          # Bật nhanh các thông số Docker cốt lõi
          echo "CONFIG_NAMESPACES=y" >> $CONF
          echo "CONFIG_CGROUPS=y" >> $CONF
          echo "CONFIG_CGROUP_FREEZER=y" >> $CONF
          echo "CONFIG_CPUSETS=y" >> $CONF
          echo "CONFIG_VETH=y" >> $CONF
          echo "CONFIG_BRIDGE=y" >> $CONF
          echo "CONFIG_IP_NF_TARGET_MASQUERADE=y" >> $CONF
          echo "CONFIG_POSIX_MQUEUE=y" >> $CONF

      - name: Build Kernel
        run: |
          # Thiết lập đường dẫn Toolchain
          export PATH=$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          make O=out defconfig
          # Chỉ build Image.gz-dtb để né lỗi 'dtbo_check' và tiết kiệm thời gian
          make -j$(nproc --all) O=out Image.gz-dtb

      - name: Upload Output
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Docker_U22_Angelica
          path: out/arch/arm64/boot/Image.gz-dtb
