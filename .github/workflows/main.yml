name: Build_Redmi9C_Auto_Config
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: xiaomi-mt6765/android_kernel_xiaomi_mt6765
          ref: lineage-17.1

      - name: Setup Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential git libssl-dev python3 flex bison libncurses-dev
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 gcc64
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 --depth=1 gcc32

      - name: Find and Patch Config
        run: |
          # Tự động tìm file config (ưu tiên angelica -> mt6765 -> defconfig)
          SEARCH_PATH="arch/arm64/configs"
          CONF=$(find $SEARCH_PATH -name "angelica_defconfig" | head -n 1)
          if [ -z "$CONF" ]; then CONF=$(find $SEARCH_PATH -name "mt6765_defconfig" | head -n 1); fi
          if [ -z "$CONF" ]; then CONF=$(find $SEARCH_PATH -name "defconfig" | head -n 1); fi
          
          echo "Đã tìm thấy file cấu hình tại: $CONF"
          echo "REAL_CONF_PATH=$CONF" >> $GITHUB_ENV
          
          # Ghi cấu hình Docker vào file vừa tìm được
          cat <<EOF >> $CONF
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CPUSETS=y
          CONFIG_BRIDGE=y
          CONFIG_VETH=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_IKCONFIG=y
          CONFIG_IKCONFIG_PROC=y
          EOF

      - name: Build Kernel
        run: |
          # Thiết lập compiler
          export GCC64=$(pwd)/gcc64/bin/aarch64-linux-android-
          export GCC32=$(pwd)/gcc32/bin/arm-linux-androideabi-
          export ARCH=arm64
          export CROSS_COMPILE=$GCC64
          export CROSS_COMPILE_ARM32=$GCC32
          
          # Lấy tên file config ngắn gọn (ví dụ: mt6765_defconfig)
          CONF_NAME=$(basename ${{ env.REAL_CONF_PATH }})
          
          # Nạp config và build
          make O=out $CONF_NAME
          make -j$(nproc --all) O=out Image.gz-dtb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Redmi9C_Final
          path: out/arch/arm64/boot/Image.gz-dtb
