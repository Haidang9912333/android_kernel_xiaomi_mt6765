name: Build_Redmi9C_Docker_GCC
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: xiaomi-mt6765/android_kernel_xiaomi_mt6765
          ref: lineage-17.1

      - name: Setup Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential git libssl-dev python3-is-python3
          # Cài đặt GCC chuẩn cho ARM64 và ARM32
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Write Docker Config to defconfig
        run: |
          CONF=arch/arm64/configs/defconfig
          # Đảm bảo bật các tính năng Docker
          cat <<EOF >> $CONF
          # Docker Support
          CONFIG_NAMESPACES=y
          CONFIG_NET_NS=y
          CONFIG_PID_NS=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_CPUSETS=y
          CONFIG_BRIDGE=y
          CONFIG_VETH=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_POSIX_MQUEUE=y
          EOF
          echo "Config updated!"

      - name: Build Kernel with GCC
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Dọn dẹp và nạp config
          make O=out defconfig
          
          # Bắt đầu build (không dùng CC=clang)
          make -j$(nproc --all) O=out \
                      CROSS_COMPILE=aarch64-linux-gnu- \
                      CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_GCC_Docker
          path: out/arch/arm64/boot/Image.gz-dtb
